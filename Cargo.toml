[package]
name = "Git-N-Grit"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[lib]
name = "gng"
path = "src/lib.rs"

[[bin]]
name = "gng"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
notify = "8.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4"] }
